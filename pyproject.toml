[project]
name = "reflexguard"
version = "0.1.0"
description = "Multi-label guardrails on System One decision models (Laya, GLiNER, Von, Jev)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
]

[project.optional-dependencies]
laya = ["laya>=0.3.10"]
gliner = ["huggingface-hub>=0.25", "numpy>=1.26", "onnxruntime>=1.20", "tokenizers>=0.20"]

[dependency-groups]
dev = [
    "altair>=6.3.0",
    "huggingface-hub>=0.25",
    "laya>=0.3.10",
    "marimo>=0.24",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "seaborn>=0.13.2",
    "tokenizers>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# The eval data, caches, notebook and docs live in the repo, not in the source distribution.
include = ["/reflexguard", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]
